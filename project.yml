name: Relay
options:
  bundleIdPrefix: dev.relay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
packages:
  RelayCore:
    path: RelayCore
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RelayCore
        product: RelayCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Relay verbindet sich per SSH mit deinem Desktop im lokalen Netz.
        NSCameraUsageDescription: Mit der Kamera aufgenommene Fotos können an eine Sitzung auf dem Desktop geschickt werden.
        NSPhotoLibraryUsageDescription: Fotos können an eine Sitzung auf dem Desktop geschickt werden.
        NSMicrophoneUsageDescription: Jarvis hört zu, wenn du aufs Mikrofon tippst.
        NSSpeechRecognitionUsageDescription: Deine Sprache wird auf dem iPhone in Text umgewandelt und an Jarvis geschickt.
        NSLocationWhenInUseUsageDescription: Relay sendet deinen Standort einmalig an den Desktop, wenn du eine Standortanfrage in der Mitteilung bestätigst.
        NSFaceIDUsageDescription: Relay lässt sich mit Face ID sperren.
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [dev.relay.ios.refresh]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.relay.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
