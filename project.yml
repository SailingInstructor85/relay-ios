name: Relay
options:
  bundleIdPrefix: dev.relay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
packages:
  RelayCore:
    path: RelayCore
settings:
  base:
    MARKETING_VERSION: "0.3.8"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RelayCore
        product: RelayCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Relay verbindet sich per SSH mit deinem Desktop im lokalen Netz.
        NSCameraUsageDescription: Mit der Kamera aufgenommene Fotos können an eine Sitzung auf dem Desktop geschickt werden.
        NSPhotoLibraryUsageDescription: Fotos können an eine Sitzung auf dem Desktop geschickt werden.
        NSMicrophoneUsageDescription: Relay hört zu, wenn du aufs Mikrofon tippst oder im Sprachmodus antwortest.
        NSSpeechRecognitionUsageDescription: Deine Sprache wird auf dem iPhone in Text umgewandelt und an Jarvis, eine Sitzung oder als Antwort auf eine Rückfrage geschickt.
        NSLocationWhenInUseUsageDescription: Relay sendet deinen Standort einmalig an den Desktop, wenn du eine Standortanfrage in der Mitteilung bestätigst.
        NSFaceIDUsageDescription: Relay lässt sich mit Face ID sperren.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Dateien für Relay
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content, public.image, public.text]
        LSSupportsOpeningDocumentsInPlace: false
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [dev.relay.ios.refresh]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.relay.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  RelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.relay.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Relay
        CODE_SIGN_STYLE: Automatic
schemes:
  Relay:
    build:
      targets:
        Relay: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RelayUITests
