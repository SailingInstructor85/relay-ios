name: iOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: RelayCore

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Version
        run: |
          V=$(grep MARKETING_VERSION project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Relay $V (${{ github.run_number }})"
      - name: Build (unsigned)
        run: |
          xcodebuild -project Relay.xcodeproj -scheme Relay -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            build > build.log 2>&1 && rc=0 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          test "$rc" -eq 0
          test -d build/Build/Products/Release-iphoneos/Relay.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Relay.app Payload/
          zip -qry Relay-unsigned.ipa Payload
          ls -la Relay-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-unsigned-ipa
          path: Relay-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-log, path: build.log }
      - name: SideStore source (tags)
        # Versionsbeschreibung („Neu in dieser Version“) aus dem Abschnitt der Version in CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp Relay-unsigned.ipa Relay.ipa
          python3 scripts/make_source.py Relay.ipa "$VERSION" "$BUILD" "${{ github.repository }}" "${GITHUB_REF#refs/tags/}" source.json CHANGELOG.md
      - name: Release-Text (tags)
        # Der Abschnitt der Version aus CHANGELOG.md plus Links auf README, Nachtlog und Changelog; fehlt der
        # Abschnitt, schreibt das Skript einen kurzen Standardtext und der Schritt bleibt grün.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/changelog_section.py "$VERSION" --changelog CHANGELOG.md --repo "${{ github.repository }}" \
            --tag "${GITHUB_REF#refs/tags/}" --release --out release.md
          cat release.md
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release.md
          files: |
            Relay.ipa
            Relay-unsigned.ipa
            source.json

  simulator:
    # Vier Teile mit je frischem Simulator: in einem Lauf über 55 Minuten wurde der Simulator gegen Ende träge und
    # einzelne Tests scheiterten zufällig (testbericht.md). Ein Teil läuft rund 15 Minuten.
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: info, classes: "InfoTests" }
          - { name: liste, classes: "ListTests NewSessionTests SetupTests" }
          - { name: chat, classes: "ChatTests" }
          - { name: eingabe, classes: "ComposeTests ScreenTests" }
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Simulator waehlen und starten
        timeout-minutes: 15
        run: |
          xcrun simctl list devices available | grep -i iphone | head -30
          UDID=$(python3 testing/pick_sim.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"
      - name: sshd und Mock-Gateway
        run: testing/ci_sshd.sh
      - name: Build for testing
        timeout-minutes: 40
        run: |
          set -o pipefail
          xcodebuild -project Relay.xcodeproj -scheme Relay -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build-for-testing > build-sim.log 2>&1 && rc=0 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)" build-sim.log | sort -u || true
          test "$rc" -eq 0
      - name: UI-Tests
        # Ein Teil läuft rund 15 Minuten. Bleibt xcodebuild hängen (Lauf 42328386349 lief in das 90-Minuten-Limit
        # des Jobs, ohne Auszug), bricht dieser Schritt ab und die Schritte danach zeigen trotzdem, wo es stand.
        timeout-minutes: 45
        run: |
          rm -rf Results.xcresult
          ONLY=""
          if [ -s testing/only.txt ]; then
            # Auswahl aus only.txt: nur die Einträge, deren Klasse zu diesem Teil gehört
            for t in $(cat testing/only.txt); do
              for c in ${{ matrix.shard.classes }}; do if [ "${t%%/*}" = "$c" ]; then ONLY="$ONLY -only-testing:RelayUITests/$t"; fi; done
            done
            if [ -z "$ONLY" ]; then echo "only.txt enthält nichts für diesen Teil"; echo 0 > test.rc; exit 0; fi
          else
            for c in ${{ matrix.shard.classes }}; do ONLY="$ONLY -only-testing:RelayUITests/$c"; done
          fi
          echo "only: $ONLY"
          run_tests() {
            rm -rf Results.xcresult
            TEST_RUNNER_RELAY_UI_PORT=2222 TEST_RUNNER_RELAY_UI_USER="$(whoami)" \
            xcodebuild -project Relay.xcodeproj -scheme Relay -configuration Debug \
              -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build-sim \
              -resultBundlePath Results.xcresult -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 $ONLY \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              test-without-building > test.log 2>&1 && rc=0 || rc=$?
          }
          run_tests
          # Startet der Test-Runner selbst nicht ("The test runner failed to initialize for UI testing", meist
          # "Timed out while loading Accessibility", Lauf 42145853158), ist kein Testfall gelaufen und die App nie
          # gestartet: Simulator neu starten und den Teil einmal wiederholen. Echte Testfehler werden nicht wiederholt.
          if [ "$rc" -ne 0 ] && grep -q "failed to initialize for UI testing" test.log && ! grep -q "Test Case '" test.log; then
            echo "Test-Runner startete nicht, Simulator neu starten und wiederholen"
            cp test.log test-versuch1.log
            xcrun simctl shutdown "$UDID" || true
            sleep 5
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            run_tests
          fi
          echo "$rc" > test.rc
          grep -E "Test Case .* (passed|failed)|TEST (SUCCEEDED|FAILED)|error:" test.log | cut -c1-300 | tail -300 || true
          echo "xcodebuild rc=$rc"
      - name: Screenshots exportieren
        if: always()
        run: |
          mkdir -p out
          xcrun xcresulttool get test-results summary --path Results.xcresult > out/summary.json 2>&1 || true
          xcrun xcresulttool get test-results tests --path Results.xcresult > out/tests.json 2>&1 || true
          xcrun xcresulttool export attachments --path Results.xcresult --output-path out/raw 2>&1 | tail -5 || true
          python3 testing/export_shots.py out/raw out/shots || true
          sudo chmod a+r /tmp/relaymock/* 2>/dev/null; cp /tmp/relaymock/mock.log /tmp/relaymock/rpc-all.jsonl /tmp/relaymock/sshd.log out/ 2>/dev/null || true
          cp test.log test-versuch1.log build-sim.log out/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 90m --predicate 'process == "Relay" AND (messageType == fault OR messageType == error)' --style compact 2>&1 | tail -n 2000 > out/relay-app-errors.log || true
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i relay > out/crash-reports.txt || true
          ls out/shots | wc -l
      # Der Upload ist Beiwerk: schlägt er fehl (Lauf 42325452387: „Request timeout … CreateArtifact“ fünfmal),
      # bleibt der Teil grün, wenn die Tests grün waren.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: simulator-results-${{ matrix.shard.name }}
          path: |
            out/shots
            out/*.json
            out/*.log
            out/crash-reports.txt
            out/rpc-all.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: xcresult-${{ matrix.shard.name }}
          path: Results.xcresult
      - name: Ergebnis
        # Bei Rot stehen die gescheiterten Testfälle und ihre Meldungen hier im Schritt, damit sie auch in
        # „gh run view --log-failed“ auftauchen (der Nachtbau sieht nur diesen Auszug, nicht die Artefakte).
        # Ohne test.rc ist der UI-Test-Schritt abgebrochen (Zeitlimit): dann steht hier, wie weit er kam.
        if: always()
        run: |
          rc=$(cat test.rc 2>/dev/null || echo 124)
          if [ "$rc" -eq 124 ]; then
            echo "UI-Tests kamen nicht zu Ende (Zeitlimit oder Abbruch). Letzte Zeilen von test.log:"
            grep -E "Test Case .* (started|passed|failed)" test.log 2>/dev/null | tail -15 | cut -c1-300 || true
            tail -20 test.log 2>/dev/null | cut -c1-300 || true
          fi
          if [ "$rc" -ne 0 ]; then
            echo "Gescheiterte Testfälle:"
            grep -E "Test Case .* failed" test.log | cut -c1-300 | sort -u || true
            echo "Fehlermeldungen:"
            grep -E "error: |Erwartet, aber nicht da|Nicht gefunden|Kennung nicht gefunden|Feld fehlt|crashed|Lost connection" test.log | cut -c1-400 | sort -u | tail -60 || true
            echo "Mock-Aufrufe zu den gescheiterten Tests (wind_down):"
            grep -E '"method": "(wind_down|wind_down_status)"' /tmp/relaymock/rpc-all.jsonl 2>/dev/null | cut -c1-300 | tail -30 || true
            echo "Mock-Log (Fehler und Sitzungen):"
            grep -E "crashed|Traceback|Error|cut by|hello" /tmp/relaymock/mock.log 2>/dev/null | tail -30 || true
            tail -5 /tmp/relaymock/sshd.log 2>/dev/null || true
          fi
          test "$rc" -eq 0
