name: iOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: swift test
        working-directory: RelayCore

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Relay.xcodeproj -scheme Relay -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Relay.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Relay.app Payload/
          zip -qry Relay-unsigned.ipa Payload
          ls -la Relay-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-unsigned-ipa
          path: Relay-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-log, path: build.log }
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Relay-unsigned.ipa
