name: iOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: RelayCore

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Version
        run: |
          V=$(grep MARKETING_VERSION project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Relay $V (${{ github.run_number }})"
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Relay.xcodeproj -scheme Relay -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Relay.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Relay.app Payload/
          zip -qry Relay-unsigned.ipa Payload
          ls -la Relay-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-unsigned-ipa
          path: Relay-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-log, path: build.log }
      - name: SideStore source (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp Relay-unsigned.ipa Relay.ipa
          python3 scripts/make_source.py Relay.ipa "$VERSION" "$BUILD" "${{ github.repository }}" "${GITHUB_REF#refs/tags/}" source.json
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Relay.ipa
            Relay-unsigned.ipa
            source.json
